[project]
name = "docent-backend"
version = "0.1.0"
description = "DOCENT — Distributed Outreach & Community Engagement Network Tracker (API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2,<3",
    "pyjwt>=2.8,<3",
    "httpx>=0.27,<1",
    "fpdf2>=2.7.6,<3",
    "pillow>=10,<13",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
lint = [
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes + the pycodestyle errors/warnings that catch real mistakes, plus
# import sorting. Deliberately narrow: style opinions stay with the reviewer.
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# schemas.py imports models/services below the helpers on purpose — those
# modules import back from here, and the late import breaks the cycle.
"app/schemas.py" = ["E402"]
