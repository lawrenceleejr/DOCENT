# CI for DOCENT — adapted from the ci-testing skill (lawrenceleejr/skills_larry).
# DOCENT doesn't use the skill's run.sh entry point, so the lint job runs ruff
# and eslint, and the test job runs pytest against a Postgres service (matching
# local dev) and builds the frontend to catch type errors. The publish job pushes
# both images to GHCR on the default branch, tagged latest + commit SHA, authed
# with GITHUB_TOKEN (no extra secrets).
name: CI

on:
  push:
  pull_request:

# Least privilege by default; the publish job asks for what it needs.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Lint backend (ruff)
        working-directory: backend
        run: |
          pip install -e '.[lint]'
          ruff check .

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh docker/backup/*.sh backend/entrypoint.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docent
          POSTGRES_PASSWORD: docent
          POSTGRES_DB: docent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docent -d docent"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e '.[test]'

      - name: Run backend tests
        working-directory: backend
        env:
          # Stats SQL uses date_trunc + native enums — tests need real Postgres.
          TEST_DATABASE_URL: postgresql+psycopg://docent:docent@localhost:5432/docent_test
        run: pytest -q

      # pytest builds its schema with create_all, so the migrations themselves
      # are exercised here: every one must apply to an empty database, and the
      # result must match the models (no forgotten migration).
      - name: Run migrations on an empty database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://docent:docent@localhost:5432/docent
        run: |
          python -m app.scripts.upgrade_db
          alembic check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (type-check + bundle)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # The real thing: a first-time install with start.sh, exactly as the README
  # tells a new admin to do it, then prove the site answers and registers.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: First-run install
        run: ./scripts/start.sh

      - name: Site answers, API healthy, containers unprivileged
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health | grep -q ok
          # PID 1 (the API) must not be root; `exec` itself would report root.
          docker compose exec -T backend grep -q "^Uid:[[:space:]]*10001" /proc/1/status
          code=$(grep '^INVITE_CODE=' .env | cut -d= -f2)
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI Admin\",\"email\":\"ci@example.org\",\"password\":\"ci-password-123\",\"invite_code\":\"$code\"}" \
            | grep -q '"is_admin":true'
          ./scripts/backup.sh
          ./scripts/start.sh   # re-running is how updates deploy; must be clean

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # People upgrade rarely and skip releases. Install an old release exactly as
  # its own README said to, fill it with data, then take it to this commit in
  # one step and back again — from the oldest release that can be seeded, and
  # from the most recent one.
  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: [v0.1.2, v0.1.9]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ${{ matrix.from }} and add data
        run: |
          set -euo pipefail
          git checkout -q "${{ matrix.from }}"
          ./scripts/start.sh
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          code=$(grep '^INVITE_CODE=' .env | cut -d= -f2)
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI Admin\",\"email\":\"ci@example.org\",\"password\":\"ci-password-123\",\"invite_code\":\"$code\"}" >/dev/null
          ./scripts/seed-demo.sh
          docker compose exec -T db psql -U docent -d docent -tAc 'SELECT count(*) FROM visits' | tr -d '[:space:]' > /tmp/visits-before
          test "$(cat /tmp/visits-before)" -gt 0

      - name: Upgrade to this commit in one step
        run: |
          set -euo pipefail
          git checkout -q "$GITHUB_SHA"
          ./scripts/upgrade.sh --to "$GITHUB_SHA" --yes
          curl -fsS http://localhost:8080/api/health | grep -q ok
          after=$(docker compose exec -T db psql -U docent -d docent -tAc 'SELECT count(*) FROM visits' | tr -d '[:space:]')
          test "$after" = "$(cat /tmp/visits-before)"
          # The account made on the old release still signs in.
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.org","password":"ci-password-123"}' | grep -q '"is_admin":true'
          ls upgrade-backups/*.dump

      - name: Roll back to ${{ matrix.from }}
        run: |
          set -euo pipefail
          ./scripts/upgrade.sh --rollback --yes
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health | grep -q ok
          after=$(docker compose exec -T db psql -U docent -d docent -tAc 'SELECT count(*) FROM visits' | tr -d '[:space:]')
          test "$after" = "$(cat /tmp/visits-before)"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # Publishes images to GHCR on:
  #   • push to main            → tags: edge, <sha>
  #   • push of a vX.Y.Z tag    → tags: <version>, latest, <sha>  (a release)
  # So `:latest` always means "latest tagged release" and `:edge` tracks main.
  publish:
    needs: [lint, test, install, upgrade]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docent" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          P="${{ steps.img.outputs.prefix }}"
          SHA="${{ github.sha }}"
          for name in backend frontend backup; do
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VER="${GITHUB_REF#refs/tags/}"
              list="$P-$name:$VER"$'\n'"$P-$name:latest"$'\n'"$P-$name:$SHA"
            else
              list="$P-$name:edge"$'\n'"$P-$name:$SHA"
            fi
            { echo "$name<<EOF"; echo "$list"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 + arm64 so the images run on both x86 servers and Arm hosts
      # (e.g. Oracle Cloud's Always-Free Ampere A1 instances).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Footer version (#26): the release tag on a vX.Y.Z build, else the short
      # commit SHA. Passed into both images (their build contexts have no .git):
      # the frontend shows it in the footer, the backend stamps PDF reports.
      - name: Compute app version
        id: appver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.backend }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.frontend }}
          build-args: |
            VITE_APP_VERSION=${{ steps.appver.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push backup
        uses: docker/build-push-action@v6
        with:
          context: ./docker/backup
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.backup }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
