# Applied to every service: cap container logs (Docker's default keeps them
# forever and eventually fills the disk) and forbid gaining privileges inside
# the container.
x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *defaults
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docent}
      POSTGRES_USER: ${POSTGRES_USER:-docent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docent} -d ${POSTGRES_DB:-docent}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    <<: *defaults
    build:
      context: ./backend
      args:
        # Stamp PDF reports with the same git version as the footer;
        # start.sh exports this.
        APP_VERSION: ${VITE_APP_VERSION:-}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docent}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # Required to register. Empty = registration closed.
      INVITE_CODE: ${INVITE_CODE:-}
      # Shown on the login/register pages for access-code / reset requests.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Optional canonical public address; admins can also set it in the app.
      SITE_URL: ${SITE_URL:-}
      # Community branding + public impact page (admins can also set in-app).
      SITE_NAME: ${SITE_NAME:-}
      PUBLIC_PAGE: ${PUBLIC_PAGE:-false}
      ACCESS_TOKEN_DAYS: ${ACCESS_TOKEN_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Optional: path (inside the container) to a CA bundle so the institution
      # importer trusts a corporate/TLS-inspecting proxy when calling Overpass /
      # Nominatim. Leave empty for normal internet.
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
    volumes:
      # Read the backup catalog and drop the "run now" sentinel the sidecar polls.
      # Host bind mount (see BACKUP_DIR in .env) so dumps survive container and
      # volume deletion — never a Docker-managed volume.
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 6
      # Generous: a big upgrade's migrations run before the API answers.
      start_period: 180s

  frontend:
    <<: *defaults
    build:
      context: ./frontend
      args:
        # Stamp the footer with the git version; start.sh exports this.
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
    ports:
      # Bind to localhost by default so the plain-HTTP app is NOT reachable
      # directly from the network. With no domain set you reach it here
      # (http://localhost:8080); when SITE_DOMAIN is set the bundled caddy
      # service below fronts it with HTTPS. Set BIND_HOST=0.0.0.0 only for a
      # trusted private LAN with no proxy.
      - "${BIND_HOST:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      # Wait for migrations to finish and the API to answer, so the site never
      # comes up in front of a backend that isn't there yet.
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Optional bundled HTTPS reverse proxy. It only runs under the "tls" profile,
  # which start.sh turns on automatically when SITE_DOMAIN is set in .env:
  #   • no SITE_DOMAIN  → caddy stays OFF; use the app at http://localhost:8080
  #   • SITE_DOMAIN set → caddy serves https://$SITE_DOMAIN on :443, obtains and
  #     renews the TLS certificate automatically, and proxies to the frontend.
  # Requires the domain's DNS to point at this machine and ports 80+443 open.
  caddy:
    <<: *defaults
    image: caddy:2
    profiles: ["tls"]
    command: caddy reverse-proxy --from ${SITE_DOMAIN:-} --to frontend:80
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data      # persists the issued certificate across restarts
      - caddy_config:/config
    depends_on:
      - frontend

  backup:
    <<: *defaults
    build: ./docker/backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-docent}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-docent}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
    volumes:
      # Host bind mount (see BACKUP_DIR in .env) so dumps survive container and
      # volume deletion — never a Docker-managed volume.
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
