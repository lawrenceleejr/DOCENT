# Preserve the original scheme when a TLS reverse proxy (Caddy/Traefik) sits in
# front: honor its X-Forwarded-Proto if present, else use our own scheme.
map $http_x_forwarded_proto $docent_forwarded_proto {
    default $scheme;
    https   https;
}

# HSTS only when the visitor actually arrived over HTTPS — sending it on a
# plain-http localhost install would be meaningless, and an empty value makes
# nginx omit the header entirely.
map $docent_forwarded_proto $docent_hsts {
    default "";
    https   "max-age=31536000";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Work out the real client address. Requests reach this container from a
    # reverse proxy on a private address (the bundled Caddy, or the Docker
    # gateway when the proxy runs on the host), so X-Forwarded-For is believed
    # only from those, and read right-to-left skipping trusted hops. A value the
    # client typed in itself therefore never becomes $remote_addr — which is what
    # the login rate limiter keys on.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Request bodies are small JSON and the odd CSV. The one large upload — a
    # database dump being restored — gets its own limit below.
    client_max_body_size 25m;

    # Security headers (sent on every response, including errors).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security $docent_hsts always;
    # App is same-origin: HTML/CSS/JS/fonts are all served from here, and no
    # inline script is allowed. The cross-origin exceptions: map tiles (img, any
    # https host, because admins can point the basemap at a provider of their
    # choice), and the optional Cloudflare Web Analytics beacon — its script
    # (static.cloudflareinsights.com) and its RUM report endpoint
    # (cloudflareinsights.com), only ever contacted when an admin has configured
    # a token. Styles need 'unsafe-inline' for Mantine's injected styles.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Passed to the API by both locations below. X-Real-IP and X-Forwarded-For
    # carry the address resolved above, replacing whatever the client sent.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $docent_forwarded_proto;
    # Admin institution imports call Overpass/Nominatim synchronously and
    # can take a while; don't cut them off at nginx's 60s default.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Restoring from an uploaded dump (admin only): allow a real database's
    # worth of data and stream it straight through instead of spooling to disk.
    location = /api/admin/backups/restore {
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
    }

    # Content-hashed build assets can be cached hard and forever. (`expires`
    # doesn't reset the inherited security headers the way add_header would.)
    location /assets/ {
        expires 1y;
    }

    # SPA routes fall back to index.html. Never cache the HTML entrypoint, so a
    # redeploy is picked up immediately instead of serving a stale bundle.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
